kind: Deployment
apiVersion: apps/v1
metadata:
  name: errordemo
  namespace: sreerrordemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: errordemo
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: errordemo
    spec:
      volumes:
        - name: appcode
          configMap:
            name: errordemoapp
            defaultMode: 420
      containers:
        - resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 2
          terminationMessagePath: /dev/termination-log
          name: app
          command:
            - python3
            - /opt/app-root/src/server.py
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: FAIL_EVERY
              value: '400'
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: Always
          volumeMounts:
            - name: appcode
              mountPath: /opt/app-root/src
          terminationMessagePolicy: File
          image: 'registry.access.redhat.com/ubi9/python-311:latest'
